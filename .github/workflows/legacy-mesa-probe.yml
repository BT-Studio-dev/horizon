name: legacy Mesa software OpenGL probe
# Diagnostic for choosing a Windows 7 / SSE4.1 Mesa llvmpipe package for the
# Legacy bundle: downloads the published Legacy client and pinned Mesa builds,
# reports each x64 DLL dependency closure and Windows 7 import problems, and
# runs the client's isolated OpenGL probe with the CPU capped at SSE4.1.

on:
  push:
    branches: ['arena/*']
    paths:
      - '.github/workflows/legacy-mesa-probe.yml'
      - 'tools/check_imports.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-mesa-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  MESA_VERSION: 25.2.6
  MESA_MSVC_SHA256: 4d21205818fb946c3a94ae2552364a1ef14d3f8a907ccd98585907cf536510a5
  MESA_MINGW_SHA256: ff06cd23881f20f3677dc567c005a476717933c16a35eb38ba70a2b34dbd8c5a
  GH_TOKEN: ${{ github.token }}

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the published Legacy client and pinned Mesa packages
        run: |
          set -euo pipefail
          mkdir -p client mesa
          gh release download 'launcher@0.2.40' --repo "$GITHUB_REPOSITORY" \
            --pattern 'horizon-client.exe' --dir client
          gh release download "$MESA_VERSION" --repo pal1000/mesa-dist-win \
            --pattern "mesa3d-$MESA_VERSION-release-msvc.7z" --dir mesa
          gh release download "$MESA_VERSION" --repo pal1000/mesa-dist-win \
            --pattern "mesa3d-$MESA_VERSION-release-mingw.7z" --dir mesa
          (cd mesa && sha256sum -c - <<EOF
          $MESA_MSVC_SHA256  mesa3d-$MESA_VERSION-release-msvc.7z
          $MESA_MINGW_SHA256  mesa3d-$MESA_VERSION-release-mingw.7z
          EOF
          )
          7z x "mesa/mesa3d-$MESA_VERSION-release-msvc.7z" -omesa/msvc >/dev/null
          7z x "mesa/mesa3d-$MESA_VERSION-release-mingw.7z" -omesa/mingw >/dev/null
          find mesa/msvc mesa/mingw -maxdepth 2 -type d | sort
      - name: Stage dependency closures and run the OpenGL probe
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          import check_imports

          client_source = Path("client/horizon-client.exe")
          successes = []
          for package in ("msvc", "mingw"):
              root = next(Path("mesa", package).rglob("x64/opengl32.dll")).parent
              dlls = {p.name.lower(): p for p in root.glob("*.dll")}
              all_names = ", ".join(sorted(p.name for p in dlls.values()))
              print(f"::notice title=Mesa {package} x64 DLLs::{all_names}", flush=True)

              queue = [dlls[name] for name in ("opengl32.dll", "libgallium_wgl.dll", "libglapi.dll") if name in dlls]
              closure = {}
              external = {}
              problems = []
              while queue:
                  path = queue.pop(0)
                  key = path.name.lower()
                  if key in closure:
                      continue
                  closure[key] = path
                  for dll, symbols in check_imports.pe_import_tables(path.read_bytes()):
                      lower = dll.lower()
                      if lower in dlls:
                          queue.append(dlls[lower])
                          continue
                      external.setdefault(lower, set()).update(symbols)
                      if not check_imports.windows_allowed(dll):
                          problems.append(f"{path.name} imports non-system {dll}")
                      elif not check_imports.windows7_allowed(dll):
                          problems.append(f"{path.name} imports post-Win7 {dll}")
                      for symbol in symbols:
                          if symbol in check_imports.WINDOWS_POST_WIN7_SYMBOLS:
                              problems.append(f"{path.name} imports post-Win7 {dll}!{symbol}")
              stage = Path("stage", package)
              if stage.exists():
                  shutil.rmtree(stage)
              stage.mkdir(parents=True)
              shutil.copy2(client_source, stage / client_source.name)
              for path in closure.values():
                  shutil.copy2(path, stage / path.name)
              closure_names = ", ".join(sorted(p.name for p in closure.values()))
              external_names = ", ".join(sorted(external))
              print(f"::notice title=Mesa {package} closure::{closure_names}", flush=True)
              print(f"::notice title=Mesa {package} external DLLs::{external_names}", flush=True)
              if problems:
                  print(f"::warning title=Mesa {package} Win7 imports::" + "; ".join(problems), flush=True)
              else:
                  print(f"::notice title=Mesa {package} Win7 imports::no problems reported by check_imports tables", flush=True)

              env = os.environ.copy()
              env.update({
                  "GALLIUM_DRIVER": "llvmpipe",
                  "GALLIUM_OVERRIDE_CPU_CAPS": "sse4.1",
                  "LP_NATIVE_VECTOR_WIDTH": "128",
                  "LIBGL_ALWAYS_SOFTWARE": "1",
              })
              result = subprocess.run(
                  [str((stage / client_source.name).resolve()), "--horizon-opengl-probe"],
                  cwd=stage,
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=120,
              )
              tail = " | ".join(result.stdout.strip().splitlines()[-5:])
              print(result.stdout, flush=True)
              if result.returncode == 0 and "HORIZON_OPENGL_OK" in result.stdout:
                  successes.append(package)
                  print(f"::notice title=Mesa {package} probe::passed: {tail}", flush=True)
              else:
                  print(f"::warning title=Mesa {package} probe::failed ({result.returncode}): {tail}", flush=True)
          if not successes:
              raise SystemExit("neither Mesa package produced an OpenGL adapter")
          print(f"::notice title=Mesa probe result::working packages: {', '.join(successes)}")
          PY
